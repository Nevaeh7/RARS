[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rars-retrieval"
version = "0.1.0"
description = "Learning Multiresolution Relevance for Hierarchical Generative Retrieval"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
  "torch>=2.6,<3",
  "transformers==4.51.3",
  "accelerate>=1.6,<2",
  "sentencepiece>=0.2,<0.3",
  "protobuf>=3.20,<7",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pyarrow>=14,<25",
  "zstandard>=0.23,<1",
  "faiss-cpu>=1.9,<2",
  "tqdm>=4.66,<5",
  "safetensors>=0.5,<1"
]

[project.scripts]
rars = "rars.cli:main"

[tool.setuptools.packages.find]
include = ["rars*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
